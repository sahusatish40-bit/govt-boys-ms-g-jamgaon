<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Grammar Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f8;color:#24364a;font:16px Arial;line-height:1.6}header{background:linear-gradient(120deg,#173d68,#2876a5);color:white;text-align:center;padding:24px 12px}main{max-width:800px;margin:20px auto;padding:0 14px}.card{background:white;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 3px 14px #173d6815}label{display:block;font-weight:bold;margin:10px 0 4px}select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #cbd8e4;width:100%}button{background:#17649b;color:white;border:0;font-weight:bold;cursor:pointer;margin:5px 0}.opt{background:#f2f7fb;color:#24364a;text-align:left;border:1px solid #d7e2ec}.opt.good{background:#e2f5e8;border-color:#39965c}.opt.bad{background:#ffefec;border-color:#d76b59}.muted{color:#60758a}.hide{display:none}.bar{height:8px;background:#e4ebf1;border-radius:10px;margin:10px 0}.bar span{display:block;height:100%;background:#27865c;width:0}.score{text-align:center;font-size:2rem;color:#17649b;font-weight:bold}
</style></head><body><header><h1>🧩 Interactive English Grammar Quiz</h1><p>कक्षा 6वीं से 8वीं • सीखें, अभ्यास करें और स्कोर देखें</p><p>शासकीय उच्चतर माध्यमिक विद्यालय जी-जामगाँव (बालक माध्य.)</p></header><main>
<section class="card" id="setup"><h2>अपना अभ्यास चुनें</h2><label for="cls">कक्षा</label><select id="cls"><option value="all">कक्षा 6–8 मिश्रित</option><option value="6">कक्षा 6</option><option value="7">कक्षा 7</option><option value="8">कक्षा 8</option></select><label for="topic">विषय</label><select id="topic"><option value="all">सभी विषय</option><option value="noun">Noun / Pronoun</option><option value="parts">Parts of Speech</option><option value="verb">Verb / Tenses</option><option value="articles">Articles / Prepositions</option><option value="sentence">Sentence / Punctuation</option></select><p class="muted">हर प्रश्न का उत्तर चुनते ही सही उत्तर और सरल व्याख्या मिलेगी।</p><button id="start">Quiz शुरू करें</button></section>
<section class="card hide" id="quiz"><div id="status"></div><div class="bar"><span id="bar"></span></div><h3 id="q"></h3><div id="opts"></div><p id="feedback"></p><button id="next" disabled>अगला प्रश्न</button></section>
<section class="card hide" id="result"><h2>अभ्यास पूरा हुआ!</h2><div class="score" id="score"></div><p id="msg"></p><button id="again">फिर से अभ्यास करें</button></section>
<p><a href="index.html">← Grammar विभाग पर वापस जाएँ</a></p></main><p style="text-align:center;color:#173d68;font-weight:bold">By Mr. S.K.Sahu</p>
<script>
const bank=[
["6","noun","‘Rita is a good girl.’ में Rita क्या है?",["Noun","Verb","Adjective","Adverb"],0,"Rita व्यक्ति का नाम है, इसलिए Proper Noun है।"],
["6","parts","‘Beautiful’ कौन-सा Parts of Speech है?",["Noun","Adjective","Verb","Pronoun"],1,"Beautiful किसी की विशेषता बताता है, इसलिए Adjective है।"],
["6","noun","‘The children are playing.’ में ‘They’ किसके स्थान पर आएगा?",["Playing","The children","Are","The"],1,"They बहुवचन Noun के स्थान पर आने वाला Pronoun है।"],
["6","articles","I ate ___ orange. सही Article चुनिए।",["a","an","the","no article"],1,"Orange की शुरुआत vowel sound से होती है, इसलिए an लगेगा।"],
["6","articles","The cat is ___ the table. (मेज के नीचे)",["on","under","between","at"],1,"Under का अर्थ है नीचे।"],
["6","verb","‘Birds fly.’ में Verb कौन-सा है?",["Birds","Fly","The","None"],1,"Fly काम/क्रिया बताता है।"],
["7","verb","He ___ football every Sunday.",["play","plays","playing","played"],1,"Simple Present में He/She/It के साथ सामान्यतः Verb में s/es लगता है।"],
["7","parts","‘She sings sweetly.’ में sweetly क्या है?",["Noun","Adjective","Adverb","Pronoun"],2,"Sweetly बताता है कि वह कैसे गाती है; यह Adverb है।"],
["7","verb","‘They are watching TV.’ कौन-सा Tense है?",["Simple Present","Present Continuous","Simple Past","Present Perfect"],1,"Are + Verb-ing से Present Continuous बनता है।"],
["7","sentence","प्रश्नवाचक वाक्य के अंत में कौन-सा चिह्न लगता है?",["Full stop (.)","Comma (,)","Question mark (?)","Apostrophe (')"],2,"प्रश्नवाचक वाक्य के अंत में Question mark (?) लगता है।"],
["7","articles","The school is ___ the post office and the bank.",["among","between","under","into"],1,"Between का प्रयोग दो के बीच के लिए होता है।"],
["8","verb","‘She has completed her work.’ कौन-सा Tense है?",["Present Perfect","Past Perfect","Present Continuous","Simple Past"],0,"Has + Verb की तीसरी form Present Perfect की रचना है।"],
["8","verb","‘They played well.’ में played कौन-सी Verb form है?",["V1","V2","V3","V-ing"],1,"Played, play का Past form (V2) है।"],
["8","sentence","Active Voice वाला वाक्य चुनिए।",["The ball was kicked by Ravi.","Ravi kicked the ball.","The work is done by her.","The letter was written by Mohan."],1,"Active Voice में Subject स्वयं काम करता है: Ravi kicked the ball."],
["8","sentence","‘What a beautiful flower___’ में सही विराम चिह्न चुनिए।",[".","?","! ",","],2,"आश्चर्य/भावना व्यक्त करने वाले वाक्य के अंत में Exclamation mark (!) लगता है।"],
["8","noun","‘Honesty is the best policy.’ में Honesty किस प्रकार का Noun है?",["Proper","Collective","Abstract","Material"],2,"Honesty एक गुण का नाम है; यह Abstract Noun है।"],
["8","verb","‘वह कल स्कूल जाएगा।’ का सही English वाक्य चुनिए।",["He go to school tomorrow.","He will go to school tomorrow.","He going to school tomorrow.","He has go to school tomorrow."],1,"Future के लिए will + Verb की पहली form आती है।"],
["8","parts","‘Wow! You won the match.’ में Wow क्या है?",["Interjection","Conjunction","Preposition","Adjective"],0,"Wow अचानक खुशी/आश्चर्य की भावना व्यक्त करता है; यह Interjection है।"]
];
let items=[],i=0,points=0,locked=false;const $=x=>document.getElementById(x);
function begin(){let c=$("cls").value,t=$("topic").value;let pool=bank.filter(x=>(c==="all"||x[0]===c)&&(t==="all"||x[1]===t));if(!pool.length){alert("इस चयन के प्रश्न उपलब्ध नहीं हैं।");return}items=pool.sort(()=>Math.random()-.5).slice(0,10);i=0;points=0;$("setup").classList.add("hide");$("result").classList.add("hide");$("quiz").classList.remove("hide");render()}
function render(){locked=false;let x=items[i];$("status").textContent="प्रश्न "+(i+1)+" / "+items.length+"   |   सही उत्तर: "+points;$("bar").style.width=(i/items.length*100)+"%";$("q").textContent=x[2];$("opts").innerHTML="";$("feedback").textContent="";$("next").disabled=true;$("next").textContent=i===items.length-1?"परिणाम देखें":"अगला प्रश्न";x[3].forEach((v,n)=>{let b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+n)+". "+v;b.onclick=()=>answer(n);$("opts").appendChild(b)})}
function answer(n){if(locked)return;locked=true;let x=items[i];[...$("opts").children].forEach((b,k)=>{b.disabled=true;if(k===x[4])b.classList.add("good");else if(k===n)b.classList.add("bad")});if(n===x[4])points++;$("status").textContent="प्रश्न "+(i+1)+" / "+items.length+"   |   सही उत्तर: "+points;$("feedback").textContent=(n===x[4]?"✓ बहुत अच्छा! ":"✗ सही उत्तर: "+x[3][x[4]]+". ")+x[5];$("next").disabled=false}
function next(){if(!locked)return;i++;if(i<items.length)render();else{$("quiz").classList.add("hide");$("result").classList.remove("hide");$("score").textContent=points+" / "+items.length;$("msg").textContent=points/items.length>=.8?"शानदार! आपकी तैयारी अच्छी है।":points/items.length>=.5?"अच्छा प्रयास! थोड़ा और अभ्यास कीजिए।":"कोई बात नहीं! नोट्स पढ़कर फिर प्रयास करें।";$("bar").style.width="100%"}}
$("start").onclick=begin;$("next").onclick=next;$("again").onclick=()=>{$("result").classList.add("hide");$("setup").classList.remove("hide")};
</script></body></html>
