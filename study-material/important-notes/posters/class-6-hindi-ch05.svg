<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#be185d"/></linearGradient></defs><rect width="1200" height="900" rx="36" fill="url(#g)"/><text x="60" y="65" fill="#fff" font-size="27" font-family="Arial">शासकीय उच्चतर माध्यमिक विद्यालय जी-जामगाँव • कक्षा 6 • NCERT मल्हार</text><text x="60" y="145" fill="#ffec99" font-size="30" font-family="Arial">पाठ 5</text><text x="60" y="220" fill="#fff" font-size="65" font-weight="bold" font-family="Arial">रहीम के दोहे</text><text x="65" y="270" fill="#dbeafe" font-size="27" font-family="Arial">नीति • विनम्रता • संबंध</text><rect x="45" y="315" width="1110" height="360" rx="28" fill="#fff"/><g font-family="Arial" fill="#17324d"><text x="90" y="375" font-size="31" font-weight="bold" fill="#075985">चित्र-नोट्स : मुख्य बातें</text><circle cx="105" cy="445" r="12" fill="#e11d48"/><text x="140" y="455" font-size="27">रहीम के दोहों में जीवन-व्यवहार की सीख सरल और प्रभावशाली ढंग से मिलती है।</text><circle cx="105" cy="525" r="12" fill="#0d9488"/><text x="140" y="535" font-size="27">प्रेम, सम्मान और विनम्रता से संबंध मजबूत होते हैं।</text><circle cx="105" cy="605" r="12" fill="#f59e0b"/><text x="140" y="615" font-size="27">कविता के भाव को अपने जीवन के उदाहरणों से जोड़ें।</text></g><rect x="70" y="710" width="1060" height="105" rx="22" fill="#fff7cc"/><text x="100" y="755" font-size="26" font-weight="bold" fill="#9a3412" font-family="Arial">स्वयं जाँचें</text><text x="100" y="795" font-size="25" fill="#17324d" font-family="Arial">रहीम के किसी एक दोहे का भावार्थ लिखिए।</text><text x="60" y="865" fill="#fff" font-size="21" font-family="Arial">प्रस्तुतकर्ता: Mr. S.K. Sahu • पढ़ें • समझें • चर्चा करें</text></svg>