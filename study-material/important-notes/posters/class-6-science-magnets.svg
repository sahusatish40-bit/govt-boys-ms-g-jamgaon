<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087f8c"/><stop offset="1" stop-color="#274c9b"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f5ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".2"/></filter></defs><rect width="1200" height="900" rx="38" fill="url(#g)"/><circle cx="1060" cy="110" r="190" fill="#fff" opacity=".1"/><circle cx="80" cy="800" r="200" fill="#fff" opacity=".08"/><text x="64" y="65" fill="#fff" font-size="22" font-family="Arial,sans-serif" font-weight="bold" letter-spacing="4">चित्रयुक्त अध्ययन पोस्टर • कक्षा 6 • विज्ञान • जिज्ञासा • अध्याय 4</text><text x="64" y="145" fill="#fff" font-size="54" font-family="Arial,'Noto Sans Devanagari',sans-serif" font-weight="bold">चुंबकों को जानें</text><rect x="55" y="190" width="1090" height="390" rx="28" fill="url(#panel)" filter="url(#s)"/><g font-family="Arial,'Noto Sans Devanagari',sans-serif"><text x="95" y="245" font-size="27" font-weight="bold" fill="#17324d">चुंबक लोहे की वस्तुओं को आकर्षित करता है</text><rect x="190" y="315" width="300" height="95" rx="18" fill="#f5f5f5" stroke="#17324d" stroke-width="5"/><path d="M190 333 Q190 315 210 315 H340 V410 H210 Q190 410 190 390Z" fill="#e34c58"/><path d="M340 315 H470 Q490 315 490 335 V390 Q490 410 470 410 H340Z" fill="#3576d2"/><text x="250" y="375" font-size="42" font-weight="bold" fill="#fff">N</text><text x="405" y="375" font-size="42" font-weight="bold" fill="#fff">S</text><path d="M250 425 Q320 510 430 425" stroke="#d49b25" stroke-width="5" fill="none" stroke-dasharray="12 9"/><text x="240" y="535" font-size="23" fill="#17324d">छड़ चुंबक</text><g fill="#697b8b"><path d="M610 365 l20 -12 20 12 -20 12Z"/><path d="M680 410 l20 -12 20 12 -20 12Z"/><path d="M750 355 l20 -12 20 12 -20 12Z"/><path d="M810 425 l20 -12 20 12 -20 12Z"/><path d="M880 365 l20 -12 20 12 -20 12Z"/></g><path d="M530 360 C600 320 620 320 650 350" fill="none" stroke="#e3a329" stroke-width="5" stroke-dasharray="10 8"/><path d="M640 337 l18 13 -22 7" fill="none" stroke="#e3a329" stroke-width="5"/><text x="600" y="490" font-size="25" fill="#17324d">लोहे की कीलें चुंबक की ओर</text><text x="600" y="530" font-size="20" fill="#536b82">प्रयोग: कागज क्लिप, लकड़ी, प्लास्टिक और लोहे को जाँचें</text></g><g font-family="Arial,'Noto Sans Devanagari',sans-serif" fill="#17324d"><rect x="65" y="610" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="90" y="648" font-size="25" font-weight="bold">ध्रुव</text><text x="90" y="681" font-size="20">चुंबक के दो सिरे—उत्तर और दक्षिण</text><rect x="610" y="610" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="635" y="648" font-size="25" font-weight="bold">आकर्षण</text><text x="635" y="681" font-size="20">लोहा जैसी कुछ वस्तुएँ आकर्षित होती हैं</text><rect x="65" y="714" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="90" y="752" font-size="25" font-weight="bold">प्रयोग</text><text x="90" y="785" font-size="20">विभिन्न वस्तुओं को पास लाकर जाँचें</text><rect x="610" y="714" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="635" y="752" font-size="25" font-weight="bold">ध्यान दें</text><text x="635" y="785" font-size="20">हर धातु चुंबक से नहीं चिपकती</text></g><text x="65" y="865" fill="#fff" font-family="Arial,'Noto Sans Devanagari',sans-serif" font-size="18">अवधारणा-आधारित मौलिक पोस्टर • पाठ्यपुस्तक का विकल्प नहीं</text></svg>