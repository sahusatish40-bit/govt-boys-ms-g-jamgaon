<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs><rect width="1200" height="900" rx="40" fill="url(#g)"/><text x="70" y="75" fill="white" font-size="28" font-family="Arial">कक्षा 7वीं • NCERT हिंदी माध्यम</text><text x="70" y="165" fill="white" font-size="64" font-weight="bold" font-family="Arial">विज्ञान</text><text x="75" y="220" fill="#e0f2fe" font-size="28" font-family="Arial">अवलोकन • प्रयोग • वैज्ञानिक सोच</text><rect x="55" y="275" width="1090" height="365" rx="28" fill="white"/><text x="105" y="345" fill="#0f766e" font-size="36" font-weight="bold" font-family="Arial">आओ सीखें</text><g fill="#17324d" font-size="29" font-family="Arial"><text x="110" y="420">① प्राकृतिक घटनाओं को ध्यान से देखें</text><text x="110" y="495">② कारण और परिणाम में संबंध समझें</text><text x="110" y="570">③ प्रयोग से प्राप्त निष्कर्ष लिखें</text></g><rect x="75" y="685" width="1050" height="105" rx="22" fill="white"/><text x="110" y="730" fill="#1d4ed8" font-size="26" font-weight="bold" font-family="Arial">याद रखें</text><text x="110" y="770" fill="#17324d" font-size="24" font-family="Arial">सोचें: प्रमाण से बात कैसे सिद्ध होगी?</text><text x="75" y="850" fill="white" font-size="22" font-family="Arial">देखें • समझें • अभ्यास करें • आगे बढ़ें</text></svg>