<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#be185d"/></linearGradient></defs><rect width="1200" height="900" rx="36" fill="url(#g)"/><text x="60" y="65" fill="#fff" font-size="27" font-family="Arial">शासकीय उच्चतर माध्यमिक विद्यालय जी-जामगाँव • कक्षा 6 • NCERT मल्हार</text><text x="60" y="145" fill="#ffec99" font-size="30" font-family="Arial">पाठ 4</text><text x="60" y="220" fill="#fff" font-size="65" font-weight="bold" font-family="Arial">हार की जीत</text><text x="65" y="270" fill="#dbeafe" font-size="27" font-family="Arial">दया • पश्चाताप • मानवीयता</text><rect x="45" y="315" width="1110" height="360" rx="28" fill="#fff"/><g font-family="Arial" fill="#17324d"><text x="90" y="375" font-size="31" font-weight="bold" fill="#075985">चित्र-नोट्स : मुख्य बातें</text><circle cx="105" cy="445" r="12" fill="#e11d48"/><text x="140" y="455" font-size="27">कहानी में दया और सद्व्यवहार की शक्ति को प्रमुखता दी गई है।</text><circle cx="105" cy="525" r="12" fill="#0d9488"/><text x="140" y="535" font-size="27">कठोरता के स्थान पर करुणा व्यक्ति के मन में परिवर्तन ला सकती है।</text><circle cx="105" cy="605" r="12" fill="#f59e0b"/><text x="140" y="615" font-size="27">सच्ची जीत दूसरों के मन को जीतने में है।</text></g><rect x="70" y="710" width="1060" height="105" rx="22" fill="#fff7cc"/><text x="100" y="755" font-size="26" font-weight="bold" fill="#9a3412" font-family="Arial">स्वयं जाँचें</text><text x="100" y="795" font-size="25" fill="#17324d" font-family="Arial">कहानी से मिलने वाली मुख्य सीख क्या है?</text><text x="60" y="865" fill="#fff" font-size="21" font-family="Arial">प्रस्तुतकर्ता: Mr. S.K. Sahu • पढ़ें • समझें • चर्चा करें</text></svg>