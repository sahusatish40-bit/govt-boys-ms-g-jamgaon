<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#be185d"/></linearGradient></defs><rect width="1200" height="900" rx="38" fill="url(#g)"/><text x="60" y="65" fill="#fff" font-size="27" font-family="Arial">शासकीय उच्चतर माध्यमिक विद्यालय जी-जामगाँव • कक्षा 6 • मल्हार</text><text x="60" y="140" fill="#ffec99" font-size="30" font-family="Arial">पाठ 6</text><text x="60" y="215" fill="#fff" font-size="61" font-weight="bold" font-family="Arial">मेरी माँ</text><text x="65" y="265" fill="#dbeafe" font-size="27" font-family="Arial">आत्मकथा • परिवार • प्रेरणा</text><rect x="45" y="300" width="1110" height="380" rx="28" fill="#fff"/><g font-family="Arial" fill="#17324d"><text x="90" y="365" font-size="31" font-weight="bold" fill="#075985">चित्र-नोट्स : पाठ को समझें</text><circle cx="105" cy="435" r="12" fill="#e11d48"/><text x="140" y="445" font-size="26">पाठ में माँ के व्यक्तित्व और जीवन-संघर्ष को ध्यान से पढ़ें।</text><circle cx="105" cy="520" r="12" fill="#0d9488"/><text x="140" y="530" font-size="26">लेखक के अनुभव, भाव और माँ के प्रति सम्मान पर चर्चा करें।</text><circle cx="105" cy="605" r="12" fill="#f59e0b"/><text x="140" y="615" font-size="26">आत्मकथा में लेखक अपने जीवन के अनुभव स्वयं लिखता है।</text></g><rect x="70" y="710" width="1060" height="105" rx="22" fill="#fff7cc"/><text x="100" y="755" font-size="26" font-weight="bold" fill="#9a3412" font-family="Arial">स्वयं जाँचें</text><text x="100" y="795" font-size="25" fill="#17324d" font-family="Arial">लेखक ने अपनी माँ के किन गुणों को याद किया है?</text><text x="60" y="865" fill="#fff" font-size="21" font-family="Arial">प्रस्तुतकर्ता: Mr. S.K. Sahu • पढ़ें • समझें • चर्चा करें</text></svg>