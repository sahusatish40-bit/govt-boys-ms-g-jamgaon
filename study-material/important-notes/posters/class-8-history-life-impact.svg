<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#9a3412"/><stop offset="1" stop-color="#1e40af"/></linearGradient></defs><rect width="1200" height="900" rx="40" fill="url(#g)"/><text x="65" y="70" fill="#fff" font-size="24" font-family="Arial">कक्षा 8 • इतिहास • SCERT संदर्भ</text><text x="65" y="150" fill="#fff" font-size="49" font-weight="bold" font-family="Arial">अंग्रेजी शासन का भारतीय जन-जीवन पर प्रभाव</text><rect x="55" y="200" width="1090" height="440" rx="28" fill="#fff"/><g font-family="Arial" fill="#17324d"><g transform="translate(100 260)"><circle cx="65" cy="65" r="54" fill="#fde68a"/><text x="43" y="82" font-size="45">₹</text><text x="145" y="55" font-size="28" font-weight="bold">आर्थिक जीवन</text><text x="145" y="95" font-size="22">कर, व्यापार और आजीविका पर प्रभाव</text></g><g transform="translate(100 390)"><circle cx="65" cy="65" r="54" fill="#bfdbfe"/><text x="40" y="82" font-size="45">⚖</text><text x="145" y="55" font-size="28" font-weight="bold">प्रशासन और शासन</text><text x="145" y="95" font-size="22">शासन-व्यवस्था और कानूनों में बदलाव</text></g><g transform="translate(100 520)"><circle cx="65" cy="45" r="54" fill="#bbf7d0"/><text x="40" y="62" font-size="45">🏘</text><text x="145" y="35" font-size="28" font-weight="bold">समाज और जीवन</text><text x="145" y="75" font-size="22">लोगों, शिक्षा और सामाजिक संबंधों पर प्रभाव</text></g></g><g font-family="Arial" fill="#fff"><text x="80" y="710" font-size="29" font-weight="bold">सोचिए और चर्चा कीजिए</text><text x="90" y="765" font-size="24">किस वर्ग पर क्या प्रभाव पड़ा? आपके पाठ में कौन-से उदाहरण दिए हैं?</text><text x="80" y="865" font-size="18">सार-विषय संकेतक • विशिष्ट तथ्य और उदाहरण SCERT पुस्तक से मिलाएँ।</text></g></svg>