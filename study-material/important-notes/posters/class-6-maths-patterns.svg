<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#167c80"/><stop offset="1" stop-color="#344e9b"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".18"/></filter></defs><rect width="1200" height="900" rx="38" fill="url(#bg)"/><circle cx="1050" cy="100" r="180" fill="#fff" opacity=".1"/><text x="65" y="65" fill="#fff" font-size="22" font-family="Arial" font-weight="bold" letter-spacing="3">चित्रयुक्त अध्ययन पोस्टर • कक्षा 6 • गणित • गणित प्रकाश • अध्याय 1</text><text x="65" y="145" fill="#fff" font-size="48" font-family="Arial,'Noto Sans Devanagari',sans-serif" font-weight="bold">गणित में पैटर्न</text><rect x="55" y="185" width="1090" height="400" rx="28" fill="#fff" filter="url(#sh)"/><g font-family="Arial,'Noto Sans Devanagari',sans-serif" fill="#17324d"><text x="100" y="245" font-size="28" font-weight="bold">पैटर्न पहचानें • नियम खोजें • आगे बढ़ाएँ</text><g transform="translate(120 290)"><rect x="0" y="0" width="120" height="120" rx="15" fill="#ef6c5b"/><rect x="145" y="0" width="120" height="120" rx="15" fill="#ef6c5b"/><rect x="290" y="0" width="120" height="120" rx="15" fill="#ef6c5b"/><rect x="435" y="0" width="120" height="120" rx="15" fill="#ef6c5b"/><text x="35" y="75" font-size="48" fill="#fff">1</text><text x="180" y="75" font-size="48" fill="#fff">2</text><text x="325" y="75" font-size="48" fill="#fff">3</text><text x="470" y="75" font-size="48" fill="#fff">4</text><text x="0" y="165" font-size="24">+1</text><text x="145" y="165" font-size="24">+1</text><text x="290" y="165" font-size="24">+1</text><text x="435" y="165" font-size="24">?</text></g><g transform="translate(760 305)"><path d="M0 100 L60 0 L120 100Z" fill="#3c91c8"/><path d="M145 100 L205 0 L265 100Z" fill="#3c91c8"/><path d="M290 100 L350 0 L410 100Z" fill="#3c91c8"/><path d="M435 100 L495 0 L555 100Z" fill="#3c91c8"/><text x="10" y="155" font-size="22">आकारों का क्रम</text></g><text x="125" y="535" font-size="24">1, 2, 3, 4, … अगली संख्या क्या होगी?</text></g><g font-family="Arial,'Noto Sans Devanagari',sans-serif" fill="#17324d"><rect x="65" y="615" width="510" height="82" rx="15" fill="#fff"/><text x="90" y="650" font-size="24" font-weight="bold">क्रम</text><text x="90" y="680" font-size="19">संख्याओं और आकृतियों का क्रम देखें</text><rect x="610" y="615" width="510" height="82" rx="15" fill="#fff"/><text x="635" y="650" font-size="24" font-weight="bold">नियम</text><text x="635" y="680" font-size="19">हर चरण में क्या बदलता है?</text><rect x="65" y="715" width="510" height="82" rx="15" fill="#fff"/><text x="90" y="750" font-size="24" font-weight="bold">अनुमान</text><text x="90" y="780" font-size="19">अगला पद सोचें</text><rect x="610" y="715" width="510" height="82" rx="15" fill="#fff"/><text x="635" y="750" font-size="24" font-weight="bold">जाँच</text><text x="635" y="780" font-size="19">नियम से उत्तर सत्यापित करें</text></g><text x="65" y="865" fill="#fff" font-family="Arial,'Noto Sans Devanagari',sans-serif" font-size="18">शासकीय उच्चतर माध्यमिक विद्यालय जी- जामगाँव (बालक माध्य.) • सीखें और आगे बढ़ें!</text></svg>