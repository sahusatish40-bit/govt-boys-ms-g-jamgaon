<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#063b73"/><stop offset="1" stop-color="#0e7490"/></linearGradient></defs><rect width="1200" height="900" rx="38" fill="url(#bg)"/><text x="65" y="68" fill="#dbeafe" font-size="28" font-family="Arial">कक्षा 6 • हिंदी • मल्हार • पाठ 1</text><text x="65" y="145" fill="#fff" font-size="64" font-weight="bold" font-family="Arial">मातृभूमि</text><text x="70" y="195" fill="#bae6fd" font-size="27" font-family="Arial">कविता • कवि: सोहनलाल द्विवेदी</text><rect x="50" y="230" width="1100" height="405" rx="28" fill="#fff"/><g transform="translate(80 275)"><path d="M20 180 L155 20 L285 180 Z" fill="#cbd5e1" stroke="#475569" stroke-width="5"/><path d="M95 90 L155 20 L215 90 L180 78 L155 105 L130 78 Z" fill="#fff"/><path d="M30 190 Q150 145 290 190" fill="none" stroke="#0ea5e9" stroke-width="12"/><path d="M320 180 Q390 110 460 180 Q530 250 600 180" fill="none" stroke="#0284c7" stroke-width="12"/><path d="M660 180 Q735 115 810 180" fill="none" stroke="#16a34a" stroke-width="8"/><circle cx="735" cy="75" r="38" fill="#fbbf24"/><path d="M700 190 Q735 115 770 190" fill="#15803d"/><path d="M735 190 V240" stroke="#854d0e" stroke-width="14"/><text x="0" y="285" font-size="24" fill="#164e63" font-family="Arial">हिमालय • नदियाँ • समुद्र • हरियाली</text></g><g font-family="Arial" fill="#17324d"><text x="85" y="690" font-size="30" font-weight="bold">कविता का केंद्रीय भाव</text><text x="85" y="738" font-size="25">भारत की प्राकृतिक सुंदरता, सांस्कृतिक विरासत और महापुरुषों के</text><text x="85" y="778" font-size="25">आदर्शों के प्रति प्रेम, गर्व और अपनापन।</text><text x="85" y="830" font-size="23" fill="#075985">याद रखें: हिमालय • सिंधु • गंगा-यमुना • राम-सीता • कृष्ण-गीता • गौतम</text></g><text x="65" y="875" fill="#e0f2fe" font-size="18" font-family="Arial">पुस्तक-आधारित अध्ययन पोस्टर • पाठ को पढ़कर संदर्भ और भाव समझें</text></svg>