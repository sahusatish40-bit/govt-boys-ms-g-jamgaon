<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#075985"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="1400" height="1000" rx="42" fill="url(#bg)"/><circle cx="1170" cy="160" r="150" fill="#fff" opacity=".10"/><circle cx="1170" cy="160" r="95" fill="#fff" opacity=".10"/><text x="72" y="82" fill="#fff" font-size="30" font-family="Arial">कक्षा 6 • हिंदी • NCERT पुस्तक: मल्हार</text><text x="72" y="175" fill="#fff" font-size="74" font-weight="bold" font-family="Arial">पाठ 1 — मातृभूमि</text><text x="78" y="228" fill="#e0f2fe" font-size="31" font-family="Arial">कवि: सोहनलाल द्विवेदी • विधा: कविता</text><rect x="55" y="275" width="1290" height="390" rx="32" fill="#fff"/><g transform="translate(90 320)"><path d="M60 200 Q180 30 300 200 Q420 35 540 200" fill="none" stroke="#0f766e" stroke-width="18" stroke-linecap="round"/><path d="M55 205 Q170 130 285 205 L285 265 L55 265Z" fill="#86efac"/><path d="M310 205 Q430 125 550 205 L550 265 L310 265Z" fill="#93c5fd"/><path d="M80 260 Q290 220 520 260" stroke="#d97706" stroke-width="10" fill="none"/><text x="70" y="320" fill="#075985" font-size="25" font-family="Arial">प्रकृति • पर्वत • धरती • संस्कृति</text></g><g font-family="Arial" fill="#17324d"><text x="700" y="350" font-size="35" font-weight="bold" fill="#075985">कविता का मुख्य भाव</text><text x="700" y="410" font-size="27">भारत की भौगोलिक सुंदरता, प्राकृतिक</text><text x="700" y="455" font-size="27">वैभव, संस्कृति और इतिहास का गौरव।</text><text x="700" y="525" font-size="30" font-weight="bold" fill="#7c3aed">हम क्या सीखते हैं?</text><text x="700" y="575" font-size="26">देश-प्रेम • सांस्कृतिक सम्मान • गौरव</text><text x="700" y="620" font-size="24">भारत की सुंदरता का वर्णन अपने शब्दों में करें।</text></g><rect x="65" y="710" width="1270" height="210" rx="28" fill="#fff"/><g font-family="Arial" fill="#17324d"><text x="105" y="765" font-size="32" font-weight="bold" fill="#075985">भाषा और व्याकरण</text><text x="110" y="820" font-size="25">• संज्ञा और उसके भेद पहचानें</text><text x="110" y="865" font-size="25">• कविता के शब्दों को संज्ञा के भेदों में वर्गीकृत करें</text><text x="730" y="820" font-size="25">• योजक चिह्न का प्रयोग</text><text x="730" y="865" font-size="25">• लेखन: “मेरी मातृभूमि” पर निबंध</text></g><text x="75" y="970" fill="#fff" font-size="21" font-family="Arial">स्वयं जाँचें: भारत की प्राकृतिक, सांस्कृतिक और ऐतिहासिक विशेषताओं के दो-दो उदाहरण लिखिए।</text></svg>