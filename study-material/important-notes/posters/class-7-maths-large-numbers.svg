<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bb5b24"/><stop offset="1" stop-color="#6a3a91"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".18"/></filter></defs><rect width="1200" height="900" rx="38" fill="url(#bg)"/><circle cx="1050" cy="100" r="180" fill="#fff" opacity=".1"/><text x="65" y="65" fill="#fff" font-size="22" font-family="Arial" font-weight="bold" letter-spacing="3">चित्रयुक्त अध्ययन पोस्टर • कक्षा 7 • गणित • गणित प्रकाश • भाग 1</text><text x="65" y="145" fill="#fff" font-size="48" font-family="Arial,'Noto Sans Devanagari',sans-serif" font-weight="bold">हमारे आसपास बड़ी संख्याएँ</text><rect x="55" y="185" width="1090" height="400" rx="28" fill="#fff" filter="url(#sh)"/><g font-family="Arial,'Noto Sans Devanagari',sans-serif" fill="#17324d"><text x="100" y="245" font-size="28" font-weight="bold">बड़ी संख्याएँ पढ़ें, लिखें और तुलना करें</text><rect x="115" y="295" width="420" height="150" rx="22" fill="#e5f2ff" stroke="#4389c7" stroke-width="4"/><text x="150" y="350" font-size="25" font-weight="bold">स्थान-मूल्य तालिका</text><g font-size="25" text-anchor="middle"><text x="170" y="405">लाख</text><text x="285" y="405">दस हजार</text><text x="420" y="405">हजार</text></g><g transform="translate(600 300)"><circle cx="120" cy="75" r="70" fill="#ffd166"/><circle cx="300" cy="75" r="70" fill="#67c5b5"/><text x="120" y="88" text-anchor="middle" font-size="38" font-weight="bold">1L</text><text x="300" y="88" text-anchor="middle" font-size="38" font-weight="bold">10K</text><text x="70" y="195" font-size="24">1,00,000</text><text x="250" y="195" font-size="24">10,000</text></g><text x="135" y="520" font-size="27">उदाहरण: 3,45,678 = तीन लाख पैंतालीस हजार छह सौ अठहत्तर</text></g><g font-family="Arial,'Noto Sans Devanagari',sans-serif" fill="#17324d"><rect x="65" y="615" width="510" height="82" rx="15" fill="#fff"/><text x="90" y="650" font-size="24" font-weight="bold">स्थान-मूल्य</text><text x="90" y="680" font-size="19">अंक का मान स्थान से बदलता है</text><rect x="610" y="615" width="510" height="82" rx="15" fill="#fff"/><text x="635" y="650" font-size="24" font-weight="bold">तुलना</text><text x="635" y="680" font-size="19">पहले अंकों की संख्या देखें</text><rect x="65" y="715" width="510" height="82" rx="15" fill="#fff"/><text x="90" y="750" font-size="24" font-weight="bold">पढ़ना</text><text x="90" y="780" font-size="19">अल्पविराम के समूह समझें</text><rect x="610" y="715" width="510" height="82" rx="15" fill="#fff"/><text x="635" y="750" font-size="24" font-weight="bold">अनुमान</text><text x="635" y="780" font-size="19">संख्या का लगभग मान निकालें</text></g><text x="65" y="865" fill="#fff" font-family="Arial,'Noto Sans Devanagari',sans-serif" font-size="18">शासकीय उच्चतर माध्यमिक विद्यालय जी- जामगाँव (बालक माध्य.) • सीखें और आगे बढ़ें!</text></svg>