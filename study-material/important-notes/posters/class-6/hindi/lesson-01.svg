<text x="75" y="380" font-size="32" fill="#075985" class="h">भारत की प्राकृतिक सुंदरता – कविता का चित्र</text>
<circle cx="1360" cy="420" r="55" fill="#ffd34d"/>
<path d="M80 600 L260 405 L420 600Z" fill="#8ba8bd"/><path d="M230 600 L455 380 L670 600Z" fill="#6688a4"/><path d="M410 600 L585 430 L760 600Z" fill="#a5bfce"/>
