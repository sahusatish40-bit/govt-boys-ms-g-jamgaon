<!-- card headers -->
<g><rect x="35" y="685" width="740" height="58" rx="18" fill="#e11d48"/><text x="70" y="725" class="head">1. कविता का केंद्रीय भाव</text>
<text x="70" y="790" class="body">• कवि अपनी मातृभूमि भारत के प्रति प्रेम व्यक्त करते हैं।</text>
<text x="70" y="838" class="body">• भारत की प्रकृति, संस्कृति और महान परंपरा का गौरव।</text>
<text x="70" y="886" class="body">• देश हमारी जन्मभूमि, कर्मभूमि और धर्मभूमि है।</text>
<text x="70" y="930" class="small">मुख्य संदेश : अपनी मातृभूमि से प्रेम और सम्मान।</text></g>
<g><rect x="825" y="685" width="740" height="58" rx="18" fill="#2563eb"/><text x="860" y="725" class="head">2. प्रकृति के मनमोहक दृश्य</text>
<text x="860" y="790" class="body">• ऊँचा हिमालय आकाश को छूता दिखाई देता है।</text>
<text x="860" y="838" class="body">• सिंधु, गंगा, यमुना और त्रिवेणी का वर्णन।</text>
<text x="860" y="886" class="body">• पहाड़ियों के झरने, चहकती चिड़ियाँ और अमराइयाँ।</text>
<text x="860" y="930" class="small">मलय पवन तन-मन को सँवारती है।</text></g>
<g><rect x="35" y="980" width="740" height="58" rx="18" fill="#16a34a"/><text x="70" y="1020" class="head">3. सांस्कृतिक और ऐतिहासिक गौरव</text>
<text x="70" y="1085" class="body">• रघुपति (श्रीराम) और सीता की पावन स्मृतियाँ।</text>
<text x="70" y="1133" class="body">• श्रीकृष्ण का गीता संदेश और बाँसुरी।</text>
<text x="70" y="1181" class="body">• गौतम बुद्ध ने संसार को दया का संदेश दिया।</text>
<text x="70" y="1225" class="small">भारत : पुण्यभूमि, कर्मभूमि और बुद्धभूमि।</text></g>
<g><rect x="825" y="980" width="740" height="58" rx="18" fill="#ea580c"/><text x="860" y="1020" class="head">4. महत्वपूर्ण शब्दार्थ</text>
<text x="860" y="1085" class="body">हिमालय – भारत की उत्तरी पर्वत-श्रेणी</text>
<text x="860" y="1133" class="body">सिंधु – एक प्रमुख नदी / समुद्र के अर्थ में भी</text>
<text x="860" y="1181" class="body">अमराई – आम के पेड़ों का समूह</text>
<text x="860" y="1225" class="body">मलय पवन – सुगंधित, शीतल हवा</text></g>
<g><rect x="35" y="1275" width="740" height="58" rx="18" fill="#9333ea"/><text x="70" y="1315" class="head">5. कविता की विशेषताएँ</text>
<text x="70" y="1380" class="body">• देशभक्ति और प्रकृति-चित्रण का सुंदर मेल।</text>
<text x="70" y="1428" class="body">• सरल, भावपूर्ण और लयात्मक भाषा।</text>
<text x="70" y="1476" class="body">• बार-बार आने वाली पंक्तियाँ भाव को दृढ़ करती हैं।</text>
<text x="70" y="1520" class="small">कवि : सोहनलाल द्विवेदी</text></g>
<g><rect x="825" y="1275" width="740" height="58" rx="18" fill="#0d9488"/><text x="860" y="1315" class="head">6. पाठ से सीखें</text>
<text x="860" y="1380" class="body">• देश की प्राकृतिक संपदा का सम्मान करें।</text>
<text x="860" y="1428" class="body">• नदियों, पहाड़ों, पेड़-पौधों और जीवों की रक्षा करें।</text>
<text x="860" y="1476" class="body">• भारत की विविध सांस्कृतिक विरासत को जानें।</text>
<text x="860" y="1520" class="small">चर्चा : आप अपनी मातृभूमि के लिए क्या करेंगे?</text></g>
<g><rect x="35" y="1570" width="1530" height="58" rx="18" fill="#ca8a04"/><text x="70" y="1610" class="head">7. अपनी समझ जाँचें – अभ्यास प्रश्न</text>
<text x="80" y="1680" class="body">1. कविता के कवि कौन हैं?  2. हिमालय के बारे में कवि क्या कहते हैं?</text>
<text x="80" y="1730" class="body">3. कविता में किन नदियों का उल्लेख है?  4. अमराई और मलय पवन का अर्थ लिखिए।</text>
<text x="80" y="1780" class="body">5. श्रीकृष्ण और गौतम बुद्ध का उल्लेख किस संदर्भ में आया है?</text>
<text x="80" y="1830" class="body">6. कविता में भारत को किन-किन नामों से पुकारा गया है?</text></g>
<rect x="35" y="1890" width="1530" height="75" rx="18" fill="url(#head)"/>
<text x="800" y="1938" text-anchor="middle" font-size="35" fill="#fff36b" class="h">पढ़ें • समझें • सोचें • अपनी मातृभूमि पर गर्व करें</text>
<text x="1500" y="1980" text-anchor="end" font-size="24" fill="#123" class="h">BY:- Mr. S.K. Sahu</text>
</svg>