<text x="800" y="132" text-anchor="middle" font-size="29" fill="white" class="h">वि.ख. – कुरुद, जिला – धमतरी (छ.ग.)</text>
<rect x="35" y="200" width="1530" height="112" rx="22" fill="url(#gold)" stroke="#f59e0b" stroke-width="4"/>
<text x="75" y="245" font-size="30" fill="#172554" class="h">कक्षा 6वीं  |  हिंदी – मल्हार  |  पाठ 1 : मातृभूमि</text>
<text x="75" y="288" font-size="25" fill="#7c2d12" class="t">कवि : सोहनलाल द्विवेदी  •  विधा : कविता</text>
