<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7df"/><stop offset=".52" stop-color="#edf8ff"/><stop offset="1" stop-color="#f4edff"/></linearGradient>
 <linearGradient id="navy" x2="1" y2="1"><stop stop-color="#082b59"/><stop offset="1" stop-color="#075985"/></linearGradient>
 <linearGradient id="saffron" x2="1" y2="0"><stop stop-color="#ff9f1c"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
 <linearGradient id="green" x2="1" y2="0"><stop stop-color="#16834a"/><stop offset="1" stop-color="#64b96b"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#18324b" flood-opacity=".17"/></filter>
 <style>
 .dev{font-family:'Noto Sans Devanagari','Arial',sans-serif}.heavy{font-weight:800}.title{font-size:58px;font-weight:900}.sub{font-size:27px}.paneltitle{font-size:31px;font-weight:800;fill:white}.body{font-size:26px;fill:#17324b}.small{font-size:22px;fill:#29445c}.tiny{font-size:19px;fill:#35516a}.white{fill:white}
 </style>
</defs>
<rect width="1800" height="2400" fill="url(#bg)"/>
<rect x="18" y="18" width="1764" height="2364" rx="38" fill="none" stroke="#0d4772" stroke-width="10"/>
<!-- masthead -->
<rect x="30" y="30" width="1740" height="205" rx="30" fill="url(#navy)"/>
<path d="M30 188 Q420 245 850 195 T1770 180 L1770 235 L30 235Z" fill="#0c416c" opacity=".8"/>
<g transform="translate(92 68)">
 <circle cx="65" cy="65" r="61" fill="#fff1b8"/><path d="M65 15 L78 52 L118 52 L86 76 L98 116 L65 91 L32 116 L44 76 L12 52 L52 52Z" fill="#f59e0b"/>
</g>
<text x="960" y="93" text-anchor="middle" class="dev heavy" font-size="48" fill="#fff2b5">शासकीय उच्चतर माध्यमिक विद्यालय जी- जामगाँव</text>
<text x="960" y="143" text-anchor="middle" class="dev heavy" font-size="28" fill="white">(बालक माध्य.) • वि.ख. कुरुद, जिला धमतरी (छ.ग.)</text>
<text x="960" y="194" text-anchor="middle" class="dev" font-size="24" fill="#d8efff">ज्ञान • संस्कृति • सृजनात्मक अध्ययन</text>
<!-- chapter title -->
<rect x="55" y="260" width="1690" height="130" rx="28" fill="url(#saffron)" stroke="#e58a0b" stroke-width="4" filter="url(#shadow)"/>
<text x="900" y="318" text-anchor="middle" class="dev heavy" font-size="34" fill="#63350a">कक्षा 6वीं  |  हिंदी – मल्हार  |  पाठ 1</text>
<text x="900" y="370" text-anchor="middle" class="dev title" fill="#142f50">मातृभूमि</text>
<text x="900" y="425" text-anchor="middle" class="dev sub" fill="#36536a">कविता • कवि : सोहनलाल द्विवेदी</text>
<!-- hero landscape -->
<rect x="55" y="455" width="1690" height="430" rx="30" fill="#dff4ff" stroke="#51a8d5" stroke-width="4" filter="url(#shadow)"/>
<text x="95" y="510" class="dev heavy" font-size="32" fill="#075985">कविता में उभरता भारत का मनोहारी प्राकृतिक दृश्य</text>
<circle cx="1510" cy="555" r="58" fill="#ffd166"/>
<g fill="#fff" opacity=".8"><ellipse cx="1310" cy="550" rx="65" ry="20"/><ellipse cx="1350" cy="540" rx="48" ry="24"/><ellipse cx="1400" cy="557" rx="58" ry="18"/></g>
<!-- Himalaya peaks -->
<path d="M95 790 L320 545 L520 790Z" fill="#7e9db4"/><path d="M250 790 L540 520 L810 790Z" fill="#5d819e"/><path d="M610 790 L830 570 L1050 790Z" fill="#90adbd"/>
<path d="M320 545 L365 600 L327 585 L300 612 L280 585Z" fill="#fff"/><path d="M540 520 L605 590 L555 572 L526 603 L505 570Z" fill="#fff"/><path d="M830 570 L875 620 L837 605 L815 630Z" fill="#fff"/>
<!-- foothills / forest -->
<path d="M55 760 Q250 680 430 770 T820 755 T1180 770 T1745 750 L1745 850 L55 850Z" fill="#75b978"/>
<g fill="#18784c"><path d="M100 800 l45 -100 45 100Z"/><path d="M170 810 l55 -125 55 125Z"/><path d="M1030 810 l55 -125 55 125Z"/><path d="M1120 810 l50 -112 50 112Z"/><path d="M1580 810 l55 -120 55 120Z"/></g>
<!-- river -->
<path d="M430 790 Q560 735 700 790 T980 790 T1270 790 T1580 790" fill="none" stroke="#1e9bd1" stroke-width="35" stroke-linecap="round"/>
<path d="M460 790 Q600 755 720 800 T1000 800 T1300 800" fill="none" stroke="#b8f0ff" stroke-width="8" stroke-linecap="round"/>
<g class="dev heavy" font-size="22" fill="#174a69"><text x="175" y="850">हिमालय</text><text x="670" y="850">गंगा–यमुना</text><text x="1110" y="850">हरियाली</text><text x="1500" y="850">नदियाँ</text></g>
<!-- three columns of panels -->
<g filter="url(#shadow)">
 <rect x="55" y="920" width="820" height="335" rx="25" fill="#fff" stroke="#e56a35" stroke-width="3"/>
 <rect x="925" y="920" width="820" height="335" rx="25" fill="#fff" stroke="#2387c9" stroke-width="3"/>
 <rect x="55" y="1280" width="820" height="335" rx="25" fill="#fff" stroke="#2e9b66" stroke-width="3"/>
 <rect x="925" y="1280" width="820" height="335" rx="25" fill="#fff" stroke="#8b5ac7" stroke-width="3"/>
 <rect x="55" y="1640" width="820" height="335" rx="25" fill="#fff" stroke="#d69a18" stroke-width="3"/>
 <rect x="925" y="1640" width="820" height="335" rx="25" fill="#fff" stroke="#d85b83" stroke-width="3"/>
</g>
<!-- panel 1 -->
<rect x="55" y="920" width="820" height="64" rx="22" fill="#d95d2b"/><text x="90" y="963" class="dev paneltitle">1. कविता का भाव</text>
<text x="92" y="1035" class="dev body">• कवि भारतभूमि के प्रति प्रेम और गौरव व्यक्त करते हैं।</text>
<text x="92" y="1085" class="dev body">• देश की प्रकृति, नदियों, पहाड़ों और हरियाली का चित्रण।</text>
<text x="92" y="1135" class="dev body">• भारत को पुण्यभूमि, धर्मभूमि और कर्मभूमि कहा गया है।</text>
<rect x="88" y="1170" width="750" height="58" rx="15" fill="#fff0df"/><text x="110" y="1208" class="dev heavy" font-size="24" fill="#8b3d17">मुख्य संदेश : अपनी मातृभूमि से प्रेम और सम्मान।</text>
<!-- panel 2 -->
<rect x="925" y="920" width="820" height="64" rx="22" fill="#1879b5"/><text x="960" y="963" class="dev paneltitle">2. प्रकृति के चित्र</text>
<g transform="translate(970 1010)">
 <path d="M0 125 L85 20 L170 125Z" fill="#7899b3"/><path d="M70 40 L85 20 L103 45 L85 39 L75 52Z" fill="white"/>
 <path d="M190 125 Q250 75 310 125 T430 125" fill="none" stroke="#209bd0" stroke-width="19"/>
 <path d="M480 125 l40 -95 40 95Z" fill="#2d9a5c"/><rect x="515" y="88" width="12" height="40" fill="#8b5a2b"/>
 <path d="M620 125 Q680 85 740 125" fill="none" stroke="#60b7d9" stroke-width="13"/>
</g>
<g class="dev small"><text x="990" y="1175">हिमालय – ऊँचा पर्वत</text><text x="1190" y="1175">नदियाँ – बहती धाराएँ</text><text x="1410" y="1175">अमराइयाँ – आम के बाग</text></g>
<text x="960" y="1220" class="dev tiny">कविता में झरने, चहकती चिड़ियाँ, कोयल और मलय पवन भी आते हैं।</text>
<!-- panel 3 -->
<rect x="55" y="1280" width="820" height="64" rx="22" fill="#218553"/><text x="90" y="1323" class="dev paneltitle">3. भारत की सांस्कृतिक विरासत</text>
<g transform="translate(100 1380)">
 <circle cx="85" cy="70" r="48" fill="#ffefd0"/><path d="M85 27 Q50 62 85 112 Q120 62 85 27Z" fill="#e0a23a"/>
 <circle cx="340" cy="70" r="48" fill="#e4f2ff"/><path d="M315 88 Q340 15 365 88 M340 26 L340 110" stroke="#2563a8" stroke-width="8" fill="none"/>
 <circle cx="600" cy="70" r="48" fill="#e8f8e8"/><path d="M570 90 Q600 15 630 90 M580 65 Q600 80 620 65" stroke="#268451" stroke-width="8" fill="none"/>
</g>
<g class="dev small"><text x="125" y="1515">राम और सीता</text><text x="390" y="1515">श्रीकृष्ण और गीता</text><text x="650" y="1515">गौतम बुद्ध</text></g>
<text x="92" y="1570" class="dev tiny">कविता इन महापुरुषों और उनसे जुड़ी परंपराओं का स्मरण कराती है।</text>
<!-- panel 4 -->
<rect x="925" y="1280" width="820" height="64" rx="22" fill="#7950a8"/><text x="960" y="1323" class="dev paneltitle">4. कविता के महत्वपूर्ण शब्द</text>
<g class="dev body"><text x="970" y="1410">सिंधु</text><text x="1240" y="1410">समुद्र</text><text x="970" y="1470">त्रिवेणी</text><text x="1240" y="1470">तीन नदियों का संगम</text><text x="970" y="1530">अमराइयाँ</text><text x="1240" y="1530">आम के वृक्षों के समूह</text><text x="970" y="1590">मलय पवन</text><text x="1240" y="1590">सुगंधित / शीतल हवा</text></g>
<path d="M955 1425 H1715 M955 1485 H1715 M955 1545 H1715" stroke="#e6dff0" stroke-width="2"/>
<!-- panel 5 -->
<rect x="55" y="1640" width="820" height="64" rx="22" fill="#bd8610"/><text x="90" y="1683" class="dev paneltitle">5. कविता से सीखें</text>
<g class="dev body"><text x="95" y="1765">★ अपनी जन्मभूमि का सम्मान करें।</text><text x="95" y="1820">★ प्रकृति और पर्यावरण की रक्षा करें।</text><text x="95" y="1875">★ देश की विविध संस्कृति पर गर्व करें।</text><text x="95" y="1930">★ दया, सद्भाव और अच्छे कर्म अपनाएँ।</text></g>
<!-- panel 6 -->
<rect x="925" y="1640" width="820" height="64" rx="22" fill="#c84e79"/><text x="960" y="1683" class="dev paneltitle">6. स्वयं जाँचें</text>
<g class="dev body"><text x="965" y="1760">1. ‘मातृभूमि’ कविता के कवि कौन हैं?</text><text x="965" y="1815">2. कविता में किन नदियों का उल्लेख है?</text><text x="965" y="1870">3. ‘त्रिवेणी’ शब्द का क्या अर्थ है?</text><text x="965" y="1925">4. कवि ने भारत को किन-किन नामों से पुकारा?</text></g>
<!-- recap strip -->
<rect x="55" y="2010" width="1690" height="235" rx="28" fill="url(#navy)" filter="url(#shadow)"/>
<text x="900" y="2070" text-anchor="middle" class="dev heavy" font-size="34" fill="#ffe08a">एक नज़र में याद रखें</text>
<g class="dev" font-size="27" fill="white" text-anchor="middle">
 <text x="310" y="2140">कवि : सोहनलाल द्विवेदी</text><text x="900" y="2140">विधा : कविता</text><text x="1480" y="2140">मुख्य भाव : देशप्रेम</text>
 <text x="900" y="2200" font-size="23" fill="#d8efff">हिमालय • नदियाँ • झरने • अमराइयाँ • महापुरुष • मातृभूमि</text>
</g>
<text x="900" y="2315" text-anchor="middle" class="dev heavy" font-size="30" fill="#123c5a">BY:- Mr. S.K. Sahu</text>
<text x="900" y="2355" text-anchor="middle" class="dev" font-size="19" fill="#42617a">अध्ययन करें • समझें • अभ्यास करें</text>
</svg>