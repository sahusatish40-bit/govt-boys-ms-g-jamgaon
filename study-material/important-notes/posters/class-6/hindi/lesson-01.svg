<rect x="55" y="630" width="710" height="48" rx="20" fill="#f97316"/><text x="82" y="663" fill="#fff" font-size="26" class="h">1. कविता का भाव</text>
<text x="85" y="720" class="body">• मातृभूमि के प्रति प्रेम और सम्मान।</text><text x="85" y="765" class="body">• भारत की प्रकृति और सांस्कृतिक विरासत पर गर्व।</text><text x="85" y="810" class="body">• देश के प्रति अपनापन और कृतज्ञता।</text>
<rect x="790" y="630" width="755" height="48" rx="20" fill="#7c3aed"/><text x="818" y="663" fill="#fff" font-size="26" class="h">2. कविता में आए संदर्भ</text>
<g class="body"><text x="825" y="720">हिमालय – पर्वतों का गौरव</text><text x="825" y="765">गंगा-यमुना – जीवनदायिनी नदियाँ</text><text x="825" y="810">राम, सीता, कृष्ण, गौतम – सांस्कृतिक स्मृतियाँ</text></g>
<rect x="55" y="865" width="710" height="48" rx="20" fill="#0d9488"/><text x="82" y="898" fill="#fff" font-size="26" class="h">3. शब्द और समझ</text>
<text x="85" y="955" class="body">मातृभूमि = जन्मभूमि / अपना देश</text><text x="85" y="1000" class="body">गौरव = गर्व • विरासत = धरोहर</text><text x="85" y="1045" class="small">कविता को स्वर और भाव के साथ पढ़ें।</text>
<rect x="790" y="865" width="755" height="48" rx="20" fill="#2563eb"/><text x="818" y="898" fill="#fff" font-size="26" class="h">4. स्वयं जाँचें</text>
<text x="825" y="955" class="body">1. कविता में भारत की किन विशेषताओं का वर्णन है?</text><text x="825" y="1000" class="body">2. मातृभूमि के प्रति आपका क्या कर्तव्य है?</text><text x="825" y="1045" class="small">उत्तर पाठ की पंक्तियों के आधार पर लिखें।</text>
<rect x="55" y="1090" width="1490" height="58" rx="18" fill="#06264b"/><text x="85" y="1128" fill="#fff" font-size="23" class="h">पढ़ें • समझें • चर्चा करें • अभ्यास करें</text><text x="1190" y="1128" fill="#ffe08a" font-size="23" class="h">BY:- Mr. S.K. Sahu</text>
