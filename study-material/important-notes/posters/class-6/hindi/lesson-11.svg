/text><rect x="205" width="180" height="145" rx="18" fill="#fef3c7"/><text x="295" y="65" text-anchor="middle" font-size="48">💡</text><text x="295" y="112" text-anchor="middle" fill="#92400e" font-size="18" font-family="Arial">भाव समझें</text><rect x="410" width="180" height="145" rx="18" fill="#dcfce7"/><text x="500" y="65" text-anchor="middle" font-size="48">📚</text><text x="500" y="112" text-anchor="middle" fill="#166534" font-size="18" font-family="Arial">पाठ दोहराएँ</text></g><rect x="810" y="655" width="742" height="300" rx="24" fill="#fff7d6" filter="url(#shadow)"/><text x="850" y="710" fill="#9a3412" font-size="31" font-weight="bold" font-family="Arial">स्वयं जाँचें</text><foreignObject x="850" y="745" width="650" height="115"><div xmlns="http://www.w3.org/1999/xhtml" style="font: bold 29px Arial,'Noto Sans Devanagari';color:#422006;line-height:1.4">चेतक का कौन-सा गुण प्रेरित करता है?</div></foreignObject><text x="850" y="900" fill="#92400e" font-size="20" font-family="Arial">उत्तर अपनी कॉपी में लिखें • पाठ से प्रमाण खोजें</text><rect x="48" y="985" width="1504" height="68" rx="20" fill="#071f3b"/><text x="78" y="1028" fill="#fff" font-size="25" font-weight="bold" font-family="Arial">पढ़ें • समझें • चर्चा करें • अभ्यास करें</text><text x="1160" y="1028" fill="#fde68a" font-size="24" font-weight="bold" font-family="Arial">BY:- Mr. S.K. Sahu</text></svg>