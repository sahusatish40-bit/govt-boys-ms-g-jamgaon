<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#064e3b"/><stop offset="1" stop-color="#0d9488"/></linearGradient><linearGradient id="gold"><stop stop-color="#fef3c7"/><stop offset="1" stop-color="#fef08a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".22"/></filter></defs><rect width="1600" height="1100" rx="34" fill="#e8eef5"/><rect x="12" y="12" width="1576" height="1076" rx="30" fill="url(#bg)"/><circle cx="1450" cy="90" r="160" fill="#fff" opacity=".07"/><circle cx="130" cy="1000" r="190" fill="#fff" opacity=".06"/><text x="55" y="57" fill="#fff" font-size="26" font-family="Arial">GOVT HSS G-JAMGAON (BOYS MS)</text><text x="55" y="92" fill="#dbeafe" font-size="21" font-family="Arial">वि.ख. कुरुद • जिला धमतरी (छ.ग.)</text><rect x="48" y="120" width="1504" height="145" rx="25" fill="url(#gold)" filter="url(#shadow)"/><text x="85" y="163" fill="#7c2d12" font-size="24" font-weight="bold" font-family="Arial">कक्षा 6वीं • हिंदी • NCERT मल्हार • पाठ 11</text><text x="85" y="225" fill="#172554" font-size="58" font-weight="bold" font-family="Arial">चेतक की वीरता</text><text x="1110" y="220" font-size="88" font-family="Arial">🐎</text><rect x="48" y="295" width="485" height="330" rx="24" fill="#fff" filter="url(#shadow)"/><text x="82" y="345" fill="#064e3b" font-size="30" font-weight="bold" font-family="Arial">पाठ परिचय</text><text x="82" y="395" fill="#334155" font-size="23" font-family="Arial">रचनाकार / संदर्भ</text><foreignObject x="82" y="410" width="405" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font: bold 29px Arial,'Noto Sans Devanagari';color:#172554">कविता</div></foreignObject><rect x="82" y="525" width="405" height="65" rx="15" fill="#fef08a"/><foreignObject x="98" y="537" width="370" height="48"><div xmlns="http://www.w3.org/1999/x