<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs><rect width="1200" height="900" rx="40" fill="url(#g)"/><text x="65" y="70" fill="#fff" font-size="25" font-family="Arial">कक्षा 7 • गणित प्रकाश • संख्या अभ्यास</text><text x="65" y="155" fill="#fff" font-size="58" font-weight="bold" font-family="Arial">हमारे आस-पास की बड़ी संख्याएँ</text><rect x="55" y="205" width="1090" height="430" rx="28" fill="#fff"/><g font-family="Arial" fill="#17324d"><text x="110" y="280" font-size="30" font-weight="bold">संख्या को समूहों में पढ़ें</text><text x="110" y="365" font-size="58" fill="#2563eb">8,42,17,305</text><text x="110" y="425" font-size="27">आठ करोड़ बयालीस लाख सत्रह हजार तीन सौ पाँच</text><g transform="translate(110 485)"><rect width="190" height="78" rx="12" fill="#dbeafe"/><rect x="205" width="190" height="78" rx="12" fill="#dcfce7"/><rect x="410" width="190" height="78" rx="12" fill="#fef3c7"/><rect x="615" width="190" height="78" rx="12" fill="#fce7f3"/><text x="25" y="48" font-size="24">करोड़</text><text x="230" y="48" font-size="24">लाख</text><text x="435" y="48" font-size="24">हजार</text><text x="640" y="48" font-size="24">इकाई</text></g></g><g font-family="Arial" fill="#fff"><text x="80" y="700" font-size="30" font-weight="bold">संख्या पढ़ने की विधि</text><text x="90" y="755" font-size="25">① अल्पविराम के अनुसार समूह बनाएँ  ② समूहों को पढ़ें</text><text x="90" y="805" font-size="25">③ अंक का स्थान-मूल्य बताएँ  ④ संख्या को शब्दों में लिखें</text><text x="80" y="865" font-size="18">उदाहरण अभ्यास हेतु है; अपनी पाठ्यपुस्तक के प्रश्न भी हल करें।</text></g></svg>