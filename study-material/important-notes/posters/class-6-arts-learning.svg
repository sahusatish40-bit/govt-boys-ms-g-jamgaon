<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="1200" height="900" rx="42" fill="url(#bg)"/><circle cx="1030" cy="150" r="105" fill="#ffffff" opacity=".12"/><circle cx="1050" cy="150" r="66" fill="#ffffff" opacity=".12"/><text x="70" y="75" font-size="27" fill="#fff" font-family="Arial">कक्षा 6वीं • NCERT • हिंदी माध्यम</text><text x="70" y="165" font-size="62" font-weight="bold" fill="#fff" font-family="Arial">कला एवं कृति</text><text x="74" y="215" font-size="27" fill="#eaf5ff" font-family="Arial">रचनात्मकता • कल्पना • निर्माण</text><rect x="55" y="270" width="1090" height="365" rx="30" fill="#fff"/><circle cx="1000" cy="360" r="75" fill="#dbeafe"/><text x="1000" y="385" text-anchor="middle" font-size="65" fill="#075985" font-family="Arial">✎</text><text x="105" y="335" font-size="34" font-weight="bold" fill="#075985" font-family="Arial">आओ सीखें</text><text x="112" y="395" font-size="27" fill="#17324d" font-family="Arial">1. रंगों और आकृतियों से अभिव्यक्ति करें</text><text x="112" y="470" font-size="27" fill="#17324d" font-family="Arial">2. स्थानीय कला और शिल्प को पहचानें</text><text x="112" y="545" font-size="27" fill="#17324d" font-family="Arial">3. नई वस्तु बनाने का प्रयास करें</text><rect x="75" y="685" width="1050" height="105" rx="22" fill="#fff" opacity=".96"/><text x="110" y="730" font-size="25" font-weight="bold" fill="#7c3aed" font-family="Arial">याद रखें</text><text x="110" y="770" font-size="24" fill="#17324d" font-family="Arial">गतिविधि: चित्र • डिजाइन • हस्तकला</text><text x="75" y="850" font-size="20" fill="#fff" font-family="Arial">देखें • समझें • अभ्यास करें • आगे बढ़ें</text></svg>