िश करें</text><rect x="865" y="400" width="130" height="78" rx="15" fill="#ffd36e"/><path d="M880 400 V370 Q930 305 980 370 V400" stroke="#315a91" stroke-width="12" fill="none"/><text x="892" y="450" font-size="23" fill="#17324d" font-weight="bold">लक्ष्य</text><text x="155" y="555" font-size="22" fill="#536b82">हर नया प्रयास हमें लक्ष्य के थोड़ा और करीब ले जाता है।</text></g><g font-family="Arial,'Noto Sans Devanagari',sans-serif" fill="#17324d"><rect x="65" y="610" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="90" y="648" font-size="25" font-weight="bold">KEEP TRYING</text><text x="90" y="681" font-size="20">Do not give up after one failure</text><rect x="610" y="610" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="635" y="648" font-size="25" font-weight="bold">LEARN</text><text x="635" y="681" font-size="20">Understand what went wrong</text><rect x="65" y="714" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="90" y="752" font-size="25" font-weight="bold">PRACTISE</text><text x="90" y="785" font-size="20">Improve step by step</text><rect x="610" y="714" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="635" y="752" font-size="25" font-weight="bold">SUCCEED</text><text x="635" y="785" font-size="20">Effort brings you closer to your goal</text></g><text x="65" y="865" fill="#fff" font-family="Arial,'Noto Sans Devanagari',sans-serif" font-size="18">Original learning poster based on the theme of perseverance; no poem lines reproduced</text></svg>