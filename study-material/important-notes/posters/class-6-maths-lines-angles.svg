<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0369a1"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="1200" height="900" rx="40" fill="url(#g)"/><text x="65" y="70" fill="#fff" font-size="25" font-family="Arial">कक्षा 6 • गणित प्रकाश • अध्याय 2</text><text x="65" y="155" fill="#fff" font-size="58" font-weight="bold" font-family="Arial">रेखाएँ और कोण</text><rect x="55" y="205" width="1090" height="430" rx="28" fill="#fff"/><g stroke="#183b63" stroke-width="9" stroke-linecap="round" fill="none"><path d="M160 420 H500"/><path d="M300 300 V540"/><path d="M650 520 L880 300"/><path d="M650 520 L990 520"/><path d="M650 520 L650 290"/></g><g fill="#e11d48"><circle cx="300" cy="420" r="12"/><circle cx="650" cy="520" r="12"/></g><g font-family="Arial" fill="#17324d"><text x="150" y="270" font-size="28" font-weight="bold">रेखा</text><text x="150" y="580" font-size="22">दोनों ओर बढ़ती है</text><text x="700" y="270" font-size="28" font-weight="bold">कोण</text><text x="700" y="580" font-size="22">दो किरणों से बनता है</text><text x="320" y="405" font-size="22">शीर्ष</text><text x="700" y="490" font-size="22">शीर्ष</text></g><g font-family="Arial" fill="#fff"><text x="80" y="700" font-size="30" font-weight="bold">याद रखें</text><text x="90" y="755" font-size="25">• न्यून कोण: 90° से कम  • समकोण: 90°</text><text x="90" y="805" font-size="25">• अधिक कोण: 90° से अधिक और 180° से कम</text><text x="80" y="865" font-size="18">चित्र देखकर कोण पहचानें और प्रोट्रैक्टर से मापने का अभ्यास करें।</text></g></svg>