<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b4b25"/><stop offset="1" stop-color="#334b7d"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f5ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".2"/></filter></defs><rect width="1200" height="900" rx="38" fill="url(#g)"/><circle cx="1060" cy="110" r="190" fill="#fff" opacity=".1"/><circle cx="80" cy="800" r="200" fill="#fff" opacity=".08"/><text x="64" y="65" fill="#fff" font-size="22" font-family="Arial,sans-serif" font-weight="bold" letter-spacing="4">चित्रयुक्त अध्ययन पोस्टर • कक्षा 8 • सामाजिक विज्ञान • इतिहास • अध्याय 2</text><text x="64" y="145" fill="#fff" font-size="54" font-family="Arial,'Noto Sans Devanagari',sans-serif" font-weight="bold">भारत में ईस्ट इंडिया कंपनी शासन की स्थापना</text><rect x="55" y="190" width="1090" height="390" rx="28" fill="url(#panel)" filter="url(#s)"/><g font-family="Arial,'Noto Sans Devanagari',sans-serif"><path d="M160 290 Q270 250 375 295 L420 380 360 485 230 520 140 430Z" fill="#e5b66d" stroke="#9b6b35" stroke-width="5"/><path d="M230 330 Q280 300 330 335 L350 410 300 465 220 430Z" fill="#f5dfb6" opacity=".8"/><text x="175" y="555" font-size="22" fill="#17324d">भारत में व्यापारिक केंद्र</text><g transform="translate(540 300)"><path d="M0 150 H360" stroke="#17324d" stroke-width="5"/><path d="M70 150 L100 40 L130 150 M210 150 L240 40 L270 150" stroke="#9a6841" stroke-width="8" fill="none"/><path d="M95 42 L240 42 L240 70 L95 70Z" fill="#d6a56e"/><path d="M160 40 V0 L210 40Z" fill="#e34c58"/><path d="M0 150 Q80 180 180 150 T360 150" fill="#8bc7db"/><text x="55" y="220" font-size="22" fill="#17324d">व्यापारिक कोठियाँ / किलेबंद केंद्र</text></g><path d="M450 395 H520" stroke="#d98b29" stroke-width="8"/><path d="M505 378 L525 395 L505 412" fill="none" stroke="#d98b29" stroke-width="8"/><path d="M925 385 l80 -35 80 35 -80 35Z" fill="#d5a66a" stroke="#8b5c38" stroke-width="5"/><path d="M950 385 V455 M980 385 V455 M1010 385 V455 M1040 385 V455" stroke="#8b5c38" stroke-width="7"/><text x="900" y="490" font-size="22" fill="#17324d">राजनीतिक प्रभाव</text><text x="545" y="555" font-size="22" fill="#536b82">व्यापार से सत्ता तक पहुँची कंपनी की कहानी</text></g><g font-family="Arial,'Noto Sans Devanagari',sans-serif" fill="#17324d"><rect x="65" y="610" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="90" y="648" font-size="25" font-weight="bold">व्यापार</text><text x="90" y="681" font-size="20">कंपनी भारत में व्यापार करने आई</text><rect x="610" y="610" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="635" y="648" font-size="25" font-weight="bold">केंद्र</text><text x="635" y="681" font-size="20">व्यापारिक गतिविधियों के केंद्र बने</text><rect x="65" y="714" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="90" y="752" font-size="25" font-weight="bold">युद्ध</text><text x="90" y="785" font-size="20">युद्धों से राजनीतिक प्रभाव बढ़ा</text><rect x="610" y="714" width="510" height="86" rx="17" fill="#fff" opacity=".96"/><text x="635" y="752" font-size="25" font-weight="bold">परिणाम</text><text x="635" y="785" font-size="20">कंपनी शासन की स्थापना की प्रक्रिया</text></g><text x="65" y="865" fill="#fff" font-family="Arial,'Noto Sans Devanagari',sans-serif" font-size="18">आधार: SCERT छत्तीसगढ़ कक्षा 8 इतिहास • विषय: व्यापारिक गतिविधियाँ एवं युद्ध</text></svg>