name: Rename Latest School Photo

on:
  workflow_dispatch:
    inputs:
      new_name:
        description: "Enter new photo name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename latest added photo
        env:
          NEW_NAME: ${{ inputs.new_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          result = subprocess.run(
              ["git", "log", "--diff-filter=A", "--no-renames",
               "--format=", "--name-only", "--", "images"],
              capture_output=True, text=True, check=True
          )

          files = [
              x.strip() for x in result.stdout.splitlines()
              if re.fullmatch(r"images/[^/]+\.(jpg|jpeg|png|webp|gif)", x.strip(), re.I)
          ]

          if not files:
              raise SystemExit("No image found")

          old = pathlib.Path(files[0])
          name = os.environ["NEW_NAME"].strip()
          if not re.fullmatch(r"[A-Za-z0-9_. -]+", name):
              raise SystemExit("Invalid new name")

          suffix = old.suffix
          new = old.with_name(name + suffix)

          if new.exists():
              raise SystemExit("New name already exists")

          old.rename(new)
          print(f"Renamed {old.name} to {new.name}")
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Rename latest school gallery photo"
          git push